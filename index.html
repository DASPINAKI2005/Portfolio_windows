<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Desktop Area -->
    <main id="desktop" tabindex="-1">
        <div id="selection-box" hidden></div>
        <!-- Icons injected via JS -->
        <div id="icon-container"></div>
        <!-- Windows injected via JS -->
        <div id="window-container"></div>
    </main>

    <!-- Context Menu -->
    <div id="context-menu" class="acrylic-menu" hidden>
        <div class="menu-item">View</div>
        <div class="menu-item">Sort By</div>
        <div class="menu-item">Refresh</div>
        <div class="menu-divider"></div>
        <div class="menu-item">New</div>
        <div class="menu-divider"></div>
        <div class="menu-item">Display Settings</div>
        <div class="menu-item">Personalize</div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="acrylic-panel" hidden>
        <div class="start-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" placeholder="Search for apps, settings, and documents">
        </div>
        <div class="start-section-title">Pinned</div>
        <div class="pinned-apps">
            <!-- Pinned apps populated by JS -->
        </div>
        <div class="start-section-title">Recommended</div>
        <div class="recommended-files">
            <div class="rec-item">
                <div class="rec-icon">📄</div>
                <div class="rec-details">
                    <div class="rec-name">Resume.pdf</div>
                    <div class="rec-time">Recently added</div>
                </div>
            </div>
            <div class="rec-item">
                <div class="rec-icon">📁</div>
                <div class="rec-details">
                    <div class="rec-name">Certificate</div>
                    <div class="rec-time">1 hour ago</div>
                </div>
            </div>
        </div>
        <div class="start-footer">
            <div class="user-profile">
                <div class="user-avatar">U</div>
                <div class="user-name">User</div>
            </div>
            <div class="power-btn" tabindex="0" role="button" aria-label="Power">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <footer id="taskbar">
        <div class="taskbar-left">
            <div class="weather-widget">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#FFD700"><path d="M12 4V2c-4.42 0-8 3.58-8 8 0 2.22.9 4.24 2.34 5.66l1.41-1.41C6.67 13.17 6 11.66 6 10c0-3.31 2.69-6 6-6zm0 14c4.42 0 8-3.58 8-8 0-2.22-.9-4.24-2.34-5.66l-1.41 1.41C17.33 6.83 18 8.34 18 10c0 3.31-2.69 6-6 6v2z"/><circle cx="12" cy="10" r="3"/></svg>
                <div class="weather-info">
                    <span class="temp">72°F</span>
                    <span class="desc">Sunny</span>
                </div>
            </div>
        </div>
        
        <div class="taskbar-center" id="taskbar-apps">
            <button class="taskbar-btn" id="start-btn" aria-label="Start">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#0078D4"><path d="M11.4 11.4H2.4V2.4h9v9zm10.2 0h-9V2.4h9v9zm-10.2 10.2H2.4v-9h9v9zm10.2 0h-9v-9h9v9z"/></svg>
            </button>
            <button class="taskbar-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="taskbar-btn" aria-label="Task View">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M4 4h7v16H4V4zm9 0h7v7h-7V4zm0 9h7v7h-7v-7z"/></svg>
            </button>
            <!-- Open app icons injected here -->
        </div>

        <div class="taskbar-right">
            <div class="system-tray">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21L15.6 16.2C14.6 15.4 13.4 15 12 15C10.6 15 9.4 15.4 8.4 16.2L12 21ZM12 3C7.9 3 4.2 4.6 1.4 7.2L3.8 10.4C5.9 8.5 8.8 7.3 12 7.3C15.2 7.3 18.1 8.5 20.2 10.4L22.6 7.2C19.8 4.6 16.1 3 12 3Z"/></svg>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.6 3H8.4L7 5H3V21H21V5H17L15.6 3ZM12 17C9.2 17 7 14.8 7 12C7 9.2 9.2 7 12 7C14.8 7 17 9.2 17 12C17 14.8 14.8 17 12 17Z"/></svg>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9V15H7L12 20V4L7 9H3ZM16.5 12C16.5 10.2 15.5 8.7 14 8V16C15.5 15.3 16.5 13.8 16.5 12ZM14 3.2V5.3C16.9 6.1 19 8.8 19 12C19 15.2 16.9 17.9 14 18.7V20.8C18 19.9 21 16.3 21 12C21 7.7 18 4.1 14 3.2Z"/></svg>
            </div>
            <div class="datetime" id="taskbar-clock">
                <div id="time">10:00 AM</div>
                <div id="date">1/1/2026</div>
            </div>
            <div id="show-desktop" aria-label="Show Desktop"></div>
        </div>
    </footer>

    <!-- Templates -->
    <template id="window-template">
        <div class="window glass-effect" tabindex="-1">
            <div class="title-bar">
                <div class="title-info">
                    <img class="title-icon" src="" alt="">
                    <span class="title-text">Window Title</span>
                </div>
                <div class="title-controls">
                    <button class="ctrl-btn minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M1,5 h8" stroke="currentColor" stroke-width="1"/></svg></button>
                    <button class="ctrl-btn maximize" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
                    <button class="ctrl-btn close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1,1 L9,9 M9,1 L1,9" stroke="currentColor" stroke-width="1.5"/></svg></button>
                </div>
            </div>
            <div class="window-content"></div>
            <!-- Resize Handles -->
            <div class="resize-handle n"></div><div class="resize-handle s"></div>
            <div class="resize-handle e"></div><div class="resize-handle w"></div>
            <div class="resize-handle nw"></div><div class="resize-handle ne"></div>
            <div class="resize-handle sw"></div><div class="resize-handle se"></div>
        </div>
    </template>

    <script src="script.js"></script>

    <!-- ============================================================
         MOBILE EXPERIENCE (Android simulation)
         Entirely separate layer from the desktop build above.
         Desktop markup/scripts/styles above are untouched.
         ============================================================ -->
    <link rel="stylesheet" href="mobile/css/gate.css">
    <link rel="stylesheet" href="mobile/css/base.css">
    <link rel="stylesheet" href="mobile/css/home.css">
    <link rel="stylesheet" href="mobile/css/app.css">
    <link rel="stylesheet" href="mobile/css/recents.css">
    <link rel="stylesheet" href="mobile/css/animations.css">
    <div id="android-root"></div>
    <script src="mobile/js/core.js"></script>
    <script src="mobile/js/icons.js"></script>
    <script src="mobile/js/apps.js"></script>
    <script src="mobile/js/shell.js"></script>
    <script src="mobile/js/home.js"></script>
    <script src="mobile/js/app-manager.js"></script>
    <script src="mobile/js/recents.js"></script>
    <script src="mobile/js/android.js"></script>
</body>
</html>
